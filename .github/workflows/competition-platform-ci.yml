name: competition-platform-ci

on:
  push:
    branches:
      - submission/competition-platform
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: competition-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Run backend test suite
        run: python -m unittest discover -s backend -p 'test*.py' -v

  frontend:
    name: Frontend production build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify pinned runtime
        run: |
          test "$(node -v)" = "v20.19.4"
          test "$(npm -v)" = "10.8.2"
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci
      - name: Build production assets
        run: npm --prefix frontend run build
      - name: Upload browser bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  deployment-contracts:
    name: Deployment contracts and preflight
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Restore built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Install deployment runtime
        run: python -m pip install -r backend/requirements.txt
      - name: Validate shell scripts
        run: find scripts deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Load Gunicorn configuration
        run: python -m py_compile deploy/gunicorn.conf.py
      - name: Run production preflight
        env:
          LA_ENV: production
          PRESENTATION_DATABASE_PATH: run/ci/presentation.db
          ATTACHMENT_STORAGE_ROOT: run/ci/attachments
          LA_MANUAL_STORAGE_ROOT: run/ci/manuals
          LA_JOB_CARD_STORAGE_ROOT: run/ci/job-cards
          FRONTEND_DIST_PATH: frontend/dist
        run: python -m backend.runtime.preflight
      - name: Check repository whitespace
        run: git diff --check
