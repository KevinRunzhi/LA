openapi: 3.1.0
info:
  title: LA Industrial Computer Case Platform API
  version: 1.1.0
  description: Multi-case execution, identity, indexed manuals, governed graph and work-order API.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/health/live:
    get:
      summary: Process liveness probe
      responses:
        "200":
          description: HTTP process is accepting requests
  /api/health/ready:
    get:
      summary: Database, case registry, attachment and frontend readiness
      responses:
        "200":
          description: All required runtime dependencies are ready
        "503":
          description: One or more required runtime dependencies are unavailable
  /api/metrics:
    get:
      summary: Prometheus text metrics with normalized route labels
      responses:
        "200":
          description: Service, uptime, in-flight, request and duration metrics
          content:
            text/plain:
              schema:
                type: string
  /api/platform/cases:
    get:
      summary: List validated runnable case packages
      responses:
        "200":
          description: Validated case summaries without hidden final answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/platform/system/capabilities:
    get:
      summary: Describe active providers and implemented platform contracts
      responses:
        "200":
          description: Runtime capability manifest without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/platform/case-routing:
    post:
      summary: Route submitted field facts to a supported case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutingRequest"
      responses:
        "200":
          description: Deterministic routing decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/platform/case-runs:
    post:
      summary: Create an isolated CaseRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WriteContract"
                - type: object
                  required: [caseId, input]
                  properties:
                    caseId:
                      type: string
                      pattern: "^CASE-[A-Z0-9-]+$"
                    input:
                      type: object
                      additionalProperties: true
      responses:
        "201":
          description: Created run at revision 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/platform/case-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      summary: Read a stage and role projected CaseRun
      parameters:
        - in: query
          name: role
          schema:
            $ref: "#/components/schemas/UserRole"
      responses:
        "200":
          description: Projected run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/platform/case-runs/{runId}/intake/confirm:
    post:
      summary: Confirm intake facts
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        $ref: "#/components/requestBodies/RevisionWrite"
      responses:
        "200":
          description: Run advanced to intake_confirmed
        "409":
          $ref: "#/components/responses/Conflict"
  /api/platform/case-runs/{runId}/diagnosis:
    post:
      summary: Produce diagnosis through the configured provider
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        $ref: "#/components/requestBodies/RevisionWrite"
      responses:
        "200":
          description: Diagnosis snapshot and diagnosed run
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: Selected remote provider is not configured
  /api/platform/case-runs/{runId}/telemetry/resolve:
    post:
      summary: Resolve requested telemetry fields from the configured provider
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor, requestedFields]
              properties:
                actor:
                  $ref: "#/components/schemas/Actor"
                equipmentId:
                  type: string
                requestedFields:
                  type: array
                  minItems: 1
                  items:
                    type: string
                submittedFacts:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Values, missing fields and telemetry provenance
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/platform/case-runs/{runId}/assistant/search:
    post:
      summary: Search only knowledge claims allowed for the current guide step
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor, stepId, query]
              properties:
                actor:
                  $ref: "#/components/schemas/Actor"
                stepId:
                  type: string
                query:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Step-scoped claim results with evidence references
        "404":
          $ref: "#/components/responses/NotFound"
  /api/platform/case-runs/{runId}/attachments:
    get:
      summary: List evidence attachments registered to a CaseRun
      parameters:
        - $ref: "#/components/parameters/RunId"
        - in: query
          name: role
          schema:
            $ref: "#/components/schemas/UserRole"
      responses:
        "200":
          description: Attachment metadata and SHA-256 hashes
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Store and register one evidence attachment
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [actorId, actorRole, file]
              properties:
                actorId:
                  type: string
                actorRole:
                  type: string
                  const: engineer
                metadata:
                  type: string
                  description: JSON object with step and evidence metadata
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: File stored and evidence metadata registered
        "400":
          $ref: "#/components/responses/ValidationError"
        "413":
          description: Attachment exceeds configured size
  /api/platform/case-runs/{runId}/plan/confirm:
    post:
      summary: Freeze the resolved maintenance plan
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        $ref: "#/components/requestBodies/RevisionWrite"
      responses:
        "200":
          description: Resolved plan snapshot saved
        "409":
          $ref: "#/components/responses/Conflict"
  /api/platform/case-runs/{runId}/guide/start:
    post:
      summary: Start execution from the frozen plan
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        $ref: "#/components/requestBodies/RevisionWrite"
      responses:
        "200":
          description: Run advanced to in_progress
  /api/platform/case-runs/{runId}/guide/steps:
    get:
      summary: Read guide steps and execution state
      parameters:
        - $ref: "#/components/parameters/RunId"
        - in: query
          name: role
          schema:
            $ref: "#/components/schemas/UserRole"
      responses:
        "200":
          description: Frozen steps with execution state
        "409":
          $ref: "#/components/responses/Conflict"
  /api/platform/case-runs/{runId}/guide/steps/{stepId}/complete:
    post:
      summary: Complete one validated guide step
      parameters:
        - $ref: "#/components/parameters/RunId"
        - in: path
          name: stepId
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/RevisionWrite"
      responses:
        "200":
          description: Step execution saved once
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/platform/case-runs/{runId}/records/generate:
    post:
      summary: Generate a maintenance record snapshot
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        $ref: "#/components/requestBodies/RevisionWrite"
      responses:
        "200":
          description: Case-specific result fields and job card contract
  /api/platform/case-runs/{runId}/engineer-submit:
    post:
      summary: Freeze and submit the engineer result
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        $ref: "#/components/requestBodies/RevisionWrite"
      responses:
        "200":
          description: Run advanced to engineer_submitted
  /api/platform/case-runs/{runId}/expert/review/start:
    post:
      summary: Start expert review
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        $ref: "#/components/requestBodies/RevisionWrite"
      responses:
        "200":
          description: Run advanced to expert_reviewing
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/platform/case-runs/{runId}/expert/review/decision:
    post:
      summary: Approve or reject an engineer submission
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        $ref: "#/components/requestBodies/RevisionWrite"
      responses:
        "200":
          description: Immutable expert decision added to the run
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/platform/case-runs/{runId}/engineer-rework/start:
    post:
      summary: Return a rejected run to engineer rework
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        $ref: "#/components/requestBodies/RevisionWrite"
      responses:
        "200":
          description: Rejected run returned to in_progress
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/platform/case-runs/{runId}/knowledge/publish:
    post:
      summary: Atomically publish knowledge and graph version delta
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        $ref: "#/components/requestBodies/RevisionWrite"
      responses:
        "200":
          description: New immutable knowledge version and graph delta
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Verification evidence or proposal is incomplete
  /api/platform/knowledge/{knowledgeId}/sync:
    post:
      summary: Synchronize one knowledge item for one engineer
      parameters:
        - in: path
          name: knowledgeId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor]
              properties:
                actor:
                  $ref: "#/components/schemas/Actor"
      responses:
        "200":
          description: Engineer local version updated
  /api/platform/case-runs/{runId}/reset:
    post:
      summary: Reset one unpublished run without deleting shared assets
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        $ref: "#/components/requestBodies/RevisionWrite"
      responses:
        "200":
          description: Target run returned to created
        "409":
          $ref: "#/components/responses/Conflict"
  /api/platform/auth/login:
    post:
      tags: [Identity]
      summary: Authenticate a platform user and issue an opaque session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: {type: string}
                password: {type: string, format: password, writeOnly: true}
      responses:
        "200":
          description: Session token returned once; only its digest is persisted
        "401":
          description: Invalid credentials
        "423":
          description: Account temporarily locked
  /api/platform/auth/me:
    get:
      tags: [Identity]
      summary: Resolve the current Bearer session
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Current user and session projection}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/platform/auth/logout:
    post:
      tags: [Identity]
      summary: Revoke the current session
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Session revoked}
  /api/platform/admin/users:
    get:
      tags: [Identity]
      summary: Page and filter platform users
      security: [{BearerAuth: []}]
      responses:
        "200": {description: User page without password or token hashes}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [Identity]
      summary: Create an engineer, expert or administrator
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201": {description: Created public user projection}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/platform/admin/users/{userId}:
    patch:
      tags: [Identity]
      summary: Update role, status, display name or profile
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/UserId"}
      responses:
        "200": {description: Updated user}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/platform/admin/users/{userId}/password:
    post:
      tags: [Identity]
      summary: Reset password and revoke all existing sessions
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/UserId"}
      responses:
        "200": {description: Password changed and sessions revoked}
  /api/platform/admin/audit-events:
    get:
      tags: [Audit]
      summary: Page immutable, redacted business audit events
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Filtered audit event page}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/platform/manuals:
    get:
      tags: [ManualKnowledge]
      summary: List indexed maintenance manuals
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Manual document page}
  /api/platform/manuals/import:
    post:
      tags: [ManualKnowledge]
      summary: Persist, extract, chunk and index one PDF manual
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, metadata]
              properties:
                file: {type: string, format: binary}
                metadata: {type: string, description: JSON object}
      responses:
        "201": {description: Indexed manual and import report}
        "409": {description: Content hash already imported}
        "413": {description: File exceeds configured limit}
        "415": {description: File is not a PDF}
        "422": {description: PDF is encrypted, invalid or has no text}
  /api/platform/manuals/{documentId}:
    get:
      tags: [ManualKnowledge]
      summary: Read indexed manual metadata
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/DocumentId"}
      responses:
        "200": {description: Manual metadata and chunk count}
    delete:
      tags: [ManualKnowledge]
      summary: Remove manual metadata, chunks, FTS rows and stored file
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/DocumentId"}
      responses:
        "200": {description: Manual removed}
  /api/platform/manuals/search:
    post:
      tags: [ManualKnowledge]
      summary: Search page-level manual evidence with FTS5 and normalized fallback
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualSearch"
      responses:
        "200": {description: Ranked evidence with document hash and page reference}
  /api/platform/manuals/{documentId}/reindex:
    post:
      tags: [ManualKnowledge]
      summary: Rebuild extracted chunks and FTS index from the stored PDF
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/DocumentId"}
      responses:
        "200": {description: Reindex report}
  /api/platform/graph:
    get:
      tags: [GovernedGraph]
      summary: Read the current immutable global graph snapshot
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Current version, nodes and edges}
  /api/platform/graph/subgraph:
    get:
      tags: [GovernedGraph]
      summary: Expand a bounded local graph around one center node
      security: [{BearerAuth: []}]
      parameters:
        - {in: query, name: centerId, required: true, schema: {type: string}}
        - {in: query, name: depth, schema: {type: integer, minimum: 0, maximum: 4, default: 1}}
        - {in: query, name: nodeTypes, schema: {type: string}}
      responses:
        "200": {description: Filtered node and edge set}
  /api/platform/graph/versions:
    get:
      tags: [GovernedGraph]
      summary: List immutable graph versions
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Graph version metadata}
  /api/platform/graph/versions/{versionId}:
    get:
      tags: [GovernedGraph]
      summary: Read one immutable graph snapshot
      security: [{BearerAuth: []}]
      parameters:
        - {in: path, name: versionId, required: true, schema: {type: string}}
      responses:
        "200": {description: Version metadata and snapshot}
  /api/platform/graph/diff:
    get:
      tags: [GovernedGraph]
      summary: Compare added, updated and removed graph entities
      security: [{BearerAuth: []}]
      parameters:
        - {in: query, name: fromVersionId, required: true, schema: {type: string}}
        - {in: query, name: toVersionId, schema: {type: string}}
      responses:
        "200": {description: Node and edge version difference}
  /api/platform/graph/change-sets:
    get:
      tags: [GovernedGraph]
      summary: List governed graph change sets
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Role-filtered change sets}
    post:
      tags: [GovernedGraph]
      summary: Create a draft based on the current graph version
      security: [{BearerAuth: []}]
      responses:
        "201": {description: Draft change set}
  /api/platform/graph/change-sets/{changeSetId}:
    get:
      tags: [GovernedGraph]
      summary: Read a change set and its entity operations
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ChangeSetId"}
      responses:
        "200": {description: Change set with items and review state}
  /api/platform/graph/change-sets/{changeSetId}/items:
    post:
      tags: [GovernedGraph]
      summary: Upsert one node or edge operation in a draft
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ChangeSetId"}
      responses:
        "200": {description: Updated draft}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/platform/graph/change-sets/{changeSetId}/submit:
    post:
      tags: [GovernedGraph]
      summary: Validate and submit a non-empty draft
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ChangeSetId"}
      responses:
        "200": {description: Submitted change set}
  /api/platform/graph/change-sets/{changeSetId}/review:
    post:
      tags: [GovernedGraph]
      summary: Approve or reject a submitted change set
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ChangeSetId"}
      responses:
        "200": {description: Reviewed change set}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/platform/graph/change-sets/{changeSetId}/publish:
    post:
      tags: [GovernedGraph]
      summary: Publish an approved change as a new immutable full snapshot
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ChangeSetId"}
      responses:
        "200": {description: New graph version}
        "409": {description: State or base-version conflict}
  /api/platform/work-orders:
    get:
      tags: [WorkOrders]
      summary: Page work orders with role filtering
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Work order page}
    post:
      tags: [WorkOrders]
      summary: Create one work order for an existing CaseRun
      security: [{BearerAuth: []}]
      responses:
        "201": {description: Versioned work order}
        "409": {description: CaseRun already has a work order}
  /api/platform/work-orders/{orderId}:
    get:
      tags: [WorkOrders]
      summary: Read one work order
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/OrderId"}
      responses:
        "200": {description: Work order}
    patch:
      tags: [WorkOrders]
      summary: Update a work order with optimistic revision control
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/OrderId"}
      responses:
        "200": {description: Updated work order}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/platform/work-orders/{orderId}/job-cards:
    get:
      tags: [WorkOrders]
      summary: List immutable job-card document versions
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/OrderId"}
      responses:
        "200": {description: Job-card metadata versions}
    post:
      tags: [WorkOrders]
      summary: Snapshot current CaseRun data and render a server-side PDF
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/OrderId"}
      responses:
        "201": {description: New or idempotently reused job-card version}
  /api/platform/job-cards/{documentId}:
    get:
      tags: [WorkOrders]
      summary: Read immutable job-card metadata and source snapshot
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/JobCardDocumentId"}
      responses:
        "200": {description: Job-card document}
  /api/platform/job-cards/{documentId}/download:
    get:
      tags: [WorkOrders]
      summary: Verify SHA-256 and download an archived PDF
      security: [{BearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/JobCardDocumentId"}
      responses:
        "200":
          description: Verified PDF document
          content:
            application/pdf:
              schema: {type: string, format: binary}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
  parameters:
    RunId:
      in: path
      name: runId
      required: true
      schema:
        type: string
        pattern: "^RUN-[A-F0-9]{32}$"
    UserId:
      in: path
      name: userId
      required: true
      schema: {type: string}
    DocumentId:
      in: path
      name: documentId
      required: true
      schema: {type: string}
    ChangeSetId:
      in: path
      name: changeSetId
      required: true
      schema: {type: string}
    OrderId:
      in: path
      name: orderId
      required: true
      schema: {type: string}
    JobCardDocumentId:
      in: path
      name: documentId
      required: true
      schema: {type: string}
  requestBodies:
    RevisionWrite:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RevisionWrite"
  responses:
    Unauthorized:
      description: Missing, expired, revoked or invalid Bearer session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Case, run or step does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Revision, state or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Actor role is not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    CreateUser:
      type: object
      additionalProperties: false
      required: [account, displayName, role, password]
      properties:
        account:
          type: string
          pattern: "^[a-zA-Z][a-zA-Z0-9_.-]{2,31}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        role:
          $ref: "#/components/schemas/UserRole"
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          writeOnly: true
        profile:
          type: object
          additionalProperties: true
    ManualSearch:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 200
        documentId: {type: string}
        vendor: {type: string}
        equipmentType: {type: string}
        faultDomain: {type: string}
        limit:
          type: integer
          minimum: 1
          maximum: 50
    UserRole:
      type: string
      enum: [engineer, expert, admin]
    Actor:
      type: object
      additionalProperties: false
      required: [id, role]
      properties:
        id:
          type: string
          minLength: 1
        role:
          $ref: "#/components/schemas/UserRole"
    WriteContract:
      type: object
      required: [idempotencyKey, actor]
      properties:
        idempotencyKey:
          type: string
          format: uuid
        actor:
          $ref: "#/components/schemas/Actor"
    RevisionWrite:
      allOf:
        - $ref: "#/components/schemas/WriteContract"
        - type: object
          required: [expectedRevision]
          properties:
            expectedRevision:
              type: integer
              minimum: 1
    RoutingRequest:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        intakeSessionId:
          type: string
        description:
          type: string
          minLength: 1
          maxLength: 2000
        equipment:
          type: object
          additionalProperties: true
        alarms:
          type: array
          items:
            type: string
        confirmedTags:
          type: array
          items:
            type: string
        measurements:
          type: object
          additionalProperties: true
        location:
          type: object
          additionalProperties: true
    RouteCandidate:
      type: object
      required: [caseId, faultCode, score, matchedFacts, hardExcluded]
      properties:
        caseId:
          type: string
        faultCode:
          type: string
        score:
          type: integer
        matchedFacts:
          type: array
          items:
            type: object
        excludedFacts:
          type: array
          items:
            type: object
        negatedFacts:
          type: array
          items:
            type: object
        missingFacts:
          type: array
          items:
            type: string
        hardExcluded:
          type: boolean
    RoutingDecision:
      type: object
      required: [routeStatus, routingAlgorithmVersion, registryVersion, candidates]
      properties:
        routeStatus:
          type: string
          enum: [matched, ambiguous, insufficient, unsupported]
        routingAlgorithmVersion:
          type: string
        registryVersion:
          type: string
        normalizedInput:
          type: string
        candidates:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/RouteCandidate"
        nextQuestion:
          type: [string, "null"]
        reason:
          type: string
    CaseRun:
      type: object
      required: [runId, caseId, packageVersion, packageHash, status, revision, payload]
      properties:
        runId:
          type: string
        caseId:
          type: string
        packageVersion:
          type: string
        packageHash:
          type: string
        status:
          type: string
          enum: [created, intake_confirmed, diagnosed, plan_confirmed, in_progress, engineer_submitted, expert_reviewing, approved, rejected, published, synced]
        revision:
          type: integer
          minimum: 1
        payload:
          type: object
          additionalProperties: true
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data: {}
    RunResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CaseRun"
    RoutingResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/RoutingDecision"
    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
